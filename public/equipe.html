<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Musikal Kombat - Équipe</title>

    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <header>
        <h1>Musikal Kombat</h1>
        <p id="nomEquipe">Équipe</p>
    </header>

    <main>

        <section id="zoneInscription">

            <h2>Rejoindre la partie</h2>

            <form id="formInscription">

                <label for="nomEquipeInput">
                    Nom de l'équipe
                </label>

                <br>

                <input
                    id="nomEquipeInput"
                    type="text"
                    maxlength="20"
                    autocomplete="off"
                    placeholder="Ex : Acabra"
                    required
                >

                <br>

                <button id="boutonInscription" type="submit">
                    Rejoindre
                </button>

            </form>

            <p id="statusInscription">
                Entrez le nom de votre équipe.
            </p>

        </section>


        <section id="interfaceEquipe">

            <p id="statusEquipe">
                En attente de la partie...
            </p>

            <button id="changerEquipe" type="button">
                🔄 Changer d'équipe
            </button>

            <h2 id="questionEquipe">
                En attente de la question...
            </h2>
        

            <div id="propositionsEquipe"></div>

            <p id="chronoEquipe">—</p>
            <div id="zoneCombo" style="display: none;">

            <h3>🥊 COMBO</h3>

            <p id="numeroMorceauCombo">
                En attente du morceau...
            </p>

            <form id="formCombo">

                <label for="reponseCombo"> Titre et artiste :</label>

                <input
                    id="reponseCombo"
                    type="text"
                    maxlength="300"
                    autocomplete="off"
                    placeholder="Ex : Billie Jean - Michael Jackson"
                    required
                    disabled
                >
                <button id="boutonEnvoyerCombo" type="submit" disabled>
                    Envoyer ma réponse
                </button>
            </form>

                <p id="statusCombo">
                    En attente du lancement...
                </p>

            </div>

            <button id="boutonBuzzer" disabled>
                🔴 BUZZER
            </button>

        </section>


        <section id="scoreEquipe">

            <h2>Score</h2>

            <p id="score">0</p>

        </section>

    </main>

    <script src="/socket.io/socket.io.js"></script>
    <script src="js/equipe.js"></script>

</body>

</html>
