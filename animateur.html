<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Musikal Kombat - Animateur</title>
    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <header>
        <h1>Musikal Kombat</h1>
        <p>Écran animateur</p>
    </header>

    <main>

        <section id="zoneAnimateur">

            <p id="statusAnimateur">En attente d'une partie</p>

            <button id="nouvellePartie">Nouvelle partie</button>
            <button id="testSprint">🧪 Tester Sprint</button>
            <button id="mancheSuivante" disabled>
                Passer à la manche suivante
            </button>

            <div id="validationSprint">
                <button id="bonneReponseSprint" disabled>
                    ✅ Bonne réponse
                </button>

                <button id="mauvaiseReponseSprint" disabled>
                    ❌ Mauvaise réponse
                </button>
            </div>

            <div id="infosQuestion">
                <p id="manche">Manche : —</p>
                <p id="numeroQuestion">Question —</p>
                <p id="chrono">—</p>
            </div>

            <h2>Question</h2>

            <p id="question">
                En attente du lancement de la partie...
            </p>

            <div id="infosSprint">
                <audio id="audioSprint"></audio>
                <button id="lancerAudioSprint">▶️ Lancer l'extrait</button>
                <button id="personneNeTrouveSprint">⏭️ Personne ne trouve</button>
                <h2 id="morceauSprintAnimateur">Morceau Sprint : —</h2>
                <p id="reponseSprintAnimateur"></p>
            </div>

        </section>


        <section id="zoneScores">

            <h2>Scores</h2>

            <div id="equipesDisplay"></div>

        </section>

    </main>

    <a href="index.html">Accueil</a>

    <script src="/socket.io/socket.io.js"></script>
    <script src="js/animateur.js"></script>
    
</body>
</html>
