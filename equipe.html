<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Musikal Kombat - Équipe</title>

    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <header>
        <h1>Musikal Kombat</h1>
        <p id="nomEquipe">Équipe</p>
    </header>

    <main>

        <section id="zoneInscription">

            <h2>Rejoindre la partie</h2>

            <form id="formInscription">

                <label for="nomEquipeInput">
                    Nom de l'équipe
                </label>

                <br>

                <input
                    id="nomEquipeInput"
                    type="text"
                    maxlength="20"
                    autocomplete="off"
                    placeholder="Ex : Acabra"
                    required
                >

                <br>

                <button id="boutonInscription" type="submit">
                    Rejoindre
                </button>

            </form>

            <p id="statusInscription">
                Entrez le nom de votre équipe.
            </p>

        </section>


        <section id="interfaceEquipe">

            <p id="statusEquipe">
                En attente de la partie...
            </p>

            <h2 id="questionEquipe">
                En attente de la question...
            </h2>

            <div id="propositionsEquipe"></div>

            <p id="chronoEquipe">—</p>

        </section>


        <section id="scoreEquipe">

            <h2>Score</h2>

            <p id="score">0</p>

        </section>

    </main>

    <script src="/socket.io/socket.io.js"></script>
    <script src="js/equipe.js"></script>

</body>

</html>
