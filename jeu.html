<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Musikal Kombat</title>
    <link rel="stylesheet" href="css/style.css">
    <script src="js/jeu.js" defer></script>
</head>

<body>

    <header>
        <h1>Musikal Kombat</h1>
        <p>Le jeu musical qui te fera boxer ton tel !</p>
    </header>

    <main>

        <section id="zoneJeu">

            <p id="status"></p>

            <button id="nouvellePartie">Nouvelle partie</button>
            <button id="stop">Clore la partie</button>

            <div id="infosQuestion">
                <p id="numeroQuestion"></p>
                <p id="chrono"></p>
            </div>

            <h2>Question</h2>
            <p id="question"></p>

            <div id="propositions"></div>

        </section>

        <section id="zoneScores">

            <h2>Scores</h2>
            <div id="equipesDisplay"></div>

        </section>

        <section id="zoneFin">
            <h2>Fin de partie</h2>
            <div id="classement"></div>
        </section>

    </main>

    <a href="index.html">Accueil</a>

</body>
</html>
